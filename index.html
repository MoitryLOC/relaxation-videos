<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Relaxation Videos</title>
  <style>
    body {
      margin: 0;
      background: black;
      font-family: sans-serif;
      color: white;
      text-align: center;
    }

    h1 {
      margin: 0;
      padding: 20px;
      background: #111;
      font-size: 1.5em;
    }

    .video-section {
      padding: 30px 10px;
    }

    .video-title {
      font-size: 1.2em;
      margin-bottom: 15px;
      color: #ccc;
    }

    iframe {
      width: 90vw;
      height: 50vw;
      max-width: 720px;
      max-height: 405px;
      border: none;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <h1>Select a Relaxation Video</h1>

  <div class="video-section">
    <div class="video-title">Nature Relaxation</div>
    <iframe
      src="https://www.youtube.com/embed/iDcPh6y9rsk?controls=1&loop=1&playlist=iDcPh6y9rsk&rel=0&modestbranding=1"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>

  <div class="video-section">
    <div class="video-title">Ocean Calm</div>
    <iframe
      src="https://www.youtube.com/embed/dIMZM96Fw3o?controls=1&loop=1&playlist=dIMZM96Fw3o&rel=0&modestbranding=1"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
