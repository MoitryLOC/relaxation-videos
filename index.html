<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Relaxation Videos</title>
  <style>
    body {
      margin: 0;
      background: black;
      font-family: sans-serif;
      color: white;
      text-align: center;
    }

    h1 {
      margin: 0;
      padding: 20px;
      background: #111;
      font-size: 1.5em;
    }

    .video-section {
      padding: 30px 10px;
    }

    .video-title {
      font-size: 1.2em;
      margin-bottom: 15px;
      color: #ccc;
    }

    iframe {
      width: 90vw;
      height: 50vw;
      max-width: 720px;
      max-height: 405px;
      border: none;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <h1>Select a Relaxation Video</h1>

  <div class="video-section">
    <div class="video-title">Nature Relaxation</div>
    <iframe id="video1"
      src="https://www.youtube.com/embed/iDcPh6y9rsk?controls=1&rel=0&modestbranding=1&enablejsapi=1"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>
  </div>

  <div class="video-section">
    <div class="video-title">Ocean Calm</div>
    <iframe id="video2"
      src="https://www.youtube.com/embed/dIMZM96Fw3o?controls=1&rel=0&modestbranding=1&enablejsapi=1"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    // Load YouTube Player API
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    let player1, player2;

    function onYouTubeIframeAPIReady() {
      player1 = new YT.Player('video1', {
        events: {
          'onStateChange': function(event) {
            if (event.data === YT.PlayerState.ENDED) {
              player1.seekTo(0);
              player1.playVideo();
            }
          }
        }
      });

      player2 = new YT.Player('video2', {
        events: {
          'onStateChange': function(event) {
            if (event.data === YT.PlayerState.ENDED) {
              player2.seekTo(0);
              player2.playVideo();
            }
          }
        }
      });
    }
  </script>

</body>
</html>
